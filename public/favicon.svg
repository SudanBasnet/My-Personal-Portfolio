<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sudan Basnet</title>
  <desc id="desc">SB monogram orbiting a pink, violet, and blue digital world.</desc>
  <defs>
    <linearGradient id="edge" x1="8" y1="7" x2="57" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff62aa"/>
      <stop offset=".52" stop-color="#b25cfa"/>
      <stop offset="1" stop-color="#4c65f7"/>
    </linearGradient>
    <radialGradient id="world" cx="0" cy="0" r="1" gradientTransform="translate(24 21) rotate(48) scale(35)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd9e9"/>
      <stop offset=".2" stop-color="#ff62aa"/>
      <stop offset=".56" stop-color="#a24df0"/>
      <stop offset="1" stop-color="#17205c"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="60" height="60" x="2" y="2" rx="15" fill="#07070b"/>
  <rect width="58" height="58" x="3" y="3" rx="14" fill="none" stroke="url(#edge)" stroke-opacity=".72" stroke-width="2"/>

  <circle cx="32" cy="32" r="19" fill="url(#world)" opacity=".94"/>
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#edge)" stroke-width="1.6" transform="rotate(-22 32 32)" filter="url(#glow)"/>
  <circle cx="55" cy="21" r="2.2" fill="#ffb449"/>

  <g fill="none" stroke="#fffaf5" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.2">
    <path d="M29 21c-2.7-3-10.4-3.4-12.1 1.5-2.2 6.3 12.3 4.7 12.3 11.7 0 6.9-9.3 9.5-14.2 4.6"/>
    <path d="M36.2 19v25m.2-24h6.2c4.6 0 7.2 2.2 7.2 5.8 0 3.8-2.8 6-7.4 6h-6m6.2 0c5 0 8 2.2 8 6.2 0 3.8-2.8 6-8 6h-6.2"/>
  </g>
</svg>
